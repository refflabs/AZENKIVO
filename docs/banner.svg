<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="AZENKIVO, aplikasi siaga dan tanggap darurat">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="#0F172A"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <!-- jalan & rute -->
  <path d="M0 330 L1280 120" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="18"/>
  <path d="M1060 0 V400 M0 96 H1280" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="14"/>
  <path d="M1180 96 H1060 V270 H990" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1180" cy="96" r="22" fill="#2563EB" fill-opacity="0.2"/>
  <circle cx="1180" cy="96" r="10" fill="#2563EB" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="990" cy="270" r="30" fill="#FFFFFF" fill-opacity="0.08"/>
  <circle cx="990" cy="270" r="11" fill="#FFFFFF"/>
  <!-- radar -->
  <circle cx="200" cy="200" r="132" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>
  <circle cx="200" cy="200" r="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
  <!-- logo perisai -->
  <g transform="translate(150 140) scale(1)">
    <path fill="#FFFFFF" fill-opacity="0.24" d="M50,2 L94,18 L94,54 C94,84 75,106 50,118 C25,106 6,84 6,54 L6,18 Z"/>
    <path fill="#FFFFFF" d="M50,13 L84,25.5 L84,54 C84,78 69.5,96 50,106 C30.5,96 16,78 16,54 L16,25.5 Z"/>
    <path fill="#C4352B" d="M43,40 L57,40 L57,51 L68,51 L68,65 L57,65 L57,76 L43,76 L43,65 L32,65 L32,51 L43,51 Z"/>
  </g>
  <!-- teks -->
  <g font-family="'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="380" y="150" fill="#CBD5E1" font-size="20" font-weight="600" letter-spacing="4">SISTEM TANGGAP DARURAT</text>
    <text x="376" y="232" fill="#FFFFFF" font-size="84" font-weight="800" letter-spacing="6">AZENKIVO</text>
    <text x="380" y="282" fill="#CBD5E1" font-size="24">SOS satu tombol · tracking petugas · panduan P3K</text>
  </g>
  <!-- pill SOS -->
  <rect x="380" y="312" width="132" height="40" rx="20" fill="#C4352B"/>
  <text x="446" y="338" fill="#FFFFFF" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="1">TAHAN SOS</text>
  <rect x="524" y="312" width="150" height="40" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>
  <text x="599" y="338" fill="#FFFFFF" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle">Android 10+</text>
</svg>
